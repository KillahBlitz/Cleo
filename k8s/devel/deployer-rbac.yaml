# Apply with an administrator during initial environment setup.
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: cleo-dev
  name: cleo-deployer
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cleo-dev
  name: cleo-deployer
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cleo-runtime, ghcr-pull]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: cleo-dev
  name: cleo-deployer
subjects:
  - kind: ServiceAccount
    name: cleo-deployer
    namespace: cleo-dev
roleRef:
  kind: Role
  name: cleo-deployer
  apiGroup: rbac.authorization.k8s.io
