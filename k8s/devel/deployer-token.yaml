# Portable fallback for these private K3s clusters. Rotate/revoke explicitly.
# Prefer short-lived OIDC credentials when an identity provider is configured.
apiVersion: v1
kind: Secret
metadata:
  namespace: cleo-dev
  name: cleo-deployer-token
  annotations:
    kubernetes.io/service-account.name: cleo-deployer
type: kubernetes.io/service-account-token
